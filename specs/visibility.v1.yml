version: 1
visibility:
  user:
    can_view:
      - own_identity
      - own_tool_access_result
    cannot_view:
      - other_users
      - audit_logs
      - tool_secrets
  tool_backend:
    can_view:
      - exchanged_user_identity_for_own_tool
      - own_token_introspection
    cannot_view:
      - other_tools
      - admin_grants
      - audit_logs
      - google_tokens
  tool_admin:
    can_view:
      - assigned_tools
      - assigned_tool_grants
      - assigned_tool_access_requests
      - assigned_tool_audit_logs
    cannot_view:
      - tool_client_secret_after_creation
      - unrelated_tools
  platform_admin:
    can_view:
      - all_tools
      - all_users
      - all_grants
      - all_access_requests
      - audit_logs
      - oauth_public_registration_and_lifecycle_metadata_with_admin_oauth_read
      - oauth_one_time_generated_credentials_with_admin_oauth_write
    cannot_view:
      - stored_secret_hash_plaintext
      - token_plaintext
      - oauth_private_signing_keys
      - oauth_credential_secrets_after_create_or_rotate
  auditor:
    can_view:
      - audit_logs
      - users_read_only
      - tools_read_only
    cannot_write:
      - tools
      - users
      - grants
      - access_requests
