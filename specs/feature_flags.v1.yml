version: 1
feature_flags:
  enable_oauth_authorization_server:
    default: false
    status: target_not_implemented
    description: Future global dark-rollout gate for the additive OAuth P0 runtime; no environment variable or handler exists in Step 2.
  oauth_enabled_clients:
    default: []
    status: target_not_implemented
    description: Future explicit pilot-client allow-list subordinate to the global OAuth gate; never triggers legacy credential fallback.
  enable_refresh_tokens:
    default: true
    description: Issue opaque single-use refresh tokens and allow activity-driven sliding session renewal.
  enable_siem_export:
    default: false
    description: Export audit events to external SIEM.
  enable_google_group_sync:
    default: false
    description: Deferred automatic grant sync from Google Groups.
  fail_open_if_audit_log_down:
    default: false
    description: Emergency-only. Must remain false for normal production.
